# ==============================================================================
# AgroRent Backend - Production Profile Configuration (application-prod.properties)
#
# Activated when SPRING_PROFILES_ACTIVE=prod
# All sensitive values (DB credentials, JWT secrets, CORS) are injected via
# host environment variables (Render / Managed MySQL). NO SECRETS ARE HARDCODED HERE.
# ==============================================================================

# Server Port (Render supplies dynamically via PORT environment variable)
server.port=${PORT:${SERVER_PORT:8080}}

# Production Managed Supabase PostgreSQL Database Connectivity
# Injected via Render Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production JPA & Hibernate Configuration
# 'validate' verifies entity mappings against the database schema without altering or dropping tables
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Production JWT Secret (Strictly required from hosting environment)
jwt.secret=${JWT_SECRET}

# Production CORS Origins (Configured to match the production Vercel frontend domain)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Production Logging: Suppress SQL details to prevent leaking query parameters & internal data
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR

# Production Multipart Upload Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Production Cloudinary Persistent Image Storage (Injected via Render Environment Variables)
agrorent.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
agrorent.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
agrorent.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
agrorent.storage.max-file-size-bytes=5242880
agrorent.storage.max-photos-per-equipment=5

