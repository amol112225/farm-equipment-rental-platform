# Application Configuration
spring.application.name=agrorent-backend
server.port=8080

# MySQL Database Connection Configuration via Environment Variables
# Defaults to localhost:3306/agrorent_db with root user if env vars are unset
spring.datasource.url=jdbc:mysql://localhost:3306/agrorent_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Shruti@2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# ddl-auto=update creates or updates table structures automatically without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
