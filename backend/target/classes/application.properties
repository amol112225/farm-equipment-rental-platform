# Application Configuration
spring.application.name=agrorent-backend
server.port=8080

# MySQL Database Connection Configuration via Environment Variables
# Defaults to localhost:3306/agrorent_db with root user if env vars are unset
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agrorent_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# ddl-auto=update creates or updates table structures automatically without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
jwt.secret=${JWT_SECRET:agrorent_jwt_secret_key_256bit_length_requirement_satisfied_32_bytes}

# Allowed CORS Origins (Comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Multipart File Upload Configuration (Max 5MB per photo, 25MB total per request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# AgroRent Image Storage Configuration (Milestone 2)
# Cloudinary Persistent Cloud Storage (Render production target)
agrorent.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
agrorent.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
agrorent.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Local Development Filesystem Storage (Offline / local dev fallback)
agrorent.storage.local.upload-dir=${UPLOAD_DIR:uploads/equipment}
agrorent.storage.max-file-size-bytes=5242880
agrorent.storage.max-photos-per-equipment=5


